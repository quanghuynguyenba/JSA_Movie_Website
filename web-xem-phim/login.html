<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MindX Cinema</title>

    <!-- Bootstrap 6 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <!-- CSS chung của dự án -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome: icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="login-page">

    <!-- ===================== TRANG ĐĂNG NHẬP (chỉ UI) ===================== -->
    <div class="login-wrapper">

        <!-- Logo -->
        <a href="index.html" class="logo login-logo">Mind<span>X</span> Cinema</a>

        <!-- Hộp form đăng nhập -->
        <div class="login-box">
            <h1 class="login-title">Đăng nhập</h1>
            <p class="login-subtitle">Chào mừng trở lại MindX Cinema</p>

            <!--
              Chưa gắn JS xử lý.
              action="#" chỉ để form hợp lệ về mặt HTML.
            -->
            <form class="login-form" action="#" method="post">

                <!-- Username -->
                <div class="login-field">
                    <label for="username" class="login-label">Username</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" class="login-input"
                            placeholder="Nhập username" autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="login-field">
                    <label for="password" class="login-label">Password</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" class="login-input"
                            placeholder="Nhập password" autocomplete="current-password">
                    </div>
                </div>

                <!-- Nút Đăng nhập (chưa có chức năng) -->
                <button type="button" class="login-submit">
                    Đăng nhập
                </button>
            </form>

            <p class="login-footer">
                Chưa có tài khoản? <a href="#">Đăng ký</a>
            </p>
        </div>

        <!-- Link về trang chủ -->
        <a href="index.html" class="login-back">
            <i class="fa-solid fa-arrow-left"></i> Về trang chủ
        </a>
    </div>

</body>

</html>
